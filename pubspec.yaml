name: swastha
description: "Swastha Health app"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  flutter_bloc: ^9.1.1
  firebase_storage: ^14.0.1
  cloud_firestore: ^7.1.0
  image_picker: ^1.2.1
  equatable: ^3.0.0
  flutter_zoom_drawer: ^3.2.0
  flutter_advanced_drawer: ^1.5.0
  flutter_spinkit: ^5.2.2
  syncfusion_flutter_gauges: ^35.1.41
  shared_preferences: ^2.5.4
  google_sign_in: ^7.2.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  sensors_plus: ^7.0.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  device_info_plus: ^13.3.0
  flutter_svg: ^2.2.3
  styled_widget: ^0.4.1
  simple_speed_dial: ^0.1.7
  url_launcher: ^6.3.2
  audio_manager: ^1.0.0
  image_cropper: ^13.0.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - google_fonts/