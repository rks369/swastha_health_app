name: swastha
description: "Swastha Health app"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  flutter_bloc: ^9.1.1
  cloud_firestore: ^7.1.0
  flutter_spinkit: ^5.2.2
  google_sign_in: ^7.2.0
  sqflite: ^2.4.2
  intl: ^0.20.2
  fl_chart: ^1.1.1
  flutter_svg: ^2.2.3
  styled_widget: ^0.4.1
  simple_speed_dial: ^0.1.7
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  pedometer: ^4.2.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - google_fonts/