name: swastha
description: "Swastha Health app"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  flutter_bloc: ^9.1.1
  firebase_storage: ^13.0.6
  cloud_firestore: ^6.1.2
  image_picker: ^1.2.1
  equatable: ^2.0.8
  flutter_zoom_drawer: ^3.2.0
  flutter_advanced_drawer: ^1.5.0
  flutter_spinkit: ^5.2.2
  syncfusion_flutter_gauges: ^32.2.7
  shared_preferences: ^2.5.4
  google_sign_in: ^7.2.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  sensors_plus: ^7.0.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  animated_floating_buttons: ^0.0.2
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  device_info_plus: ^12.3.0
  flutter_svg: ^2.2.3
  styled_widget: ^0.4.1
  simple_speed_dial: ^0.1.7
  custom_floating_action_button: ^0.0.3
  url_launcher: ^6.3.2
  audio_manager: ^0.8.2
  image_cropper: ^11.0.0
  assets_audio_player: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - google_fonts/